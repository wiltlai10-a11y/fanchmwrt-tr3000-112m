# ==============================================================================
# GitHub Actions —— 云端编译 Cudy TR3000 v1 的 FanChmWrt 112M 大分区固件
# （集成 OpenClash + USB 上网驱动）
#
# 用法：
#   1. 在 GitHub 新建一个空仓库（Public，Public 仓库 Actions 免费额度更充足）
#   2. 把本文件放到仓库的  .github/workflows/build-tr3000-112m.yml
#   3. git push
#   4. Actions 页面 → 本 workflow → Run workflow → 选布局（112m / 114m / ubootmod）
#   5. 跑完（约 60~150 分钟）在 Artifacts 里下载固件包
#
# 说明：本 workflow 自带 FanChmWrt 源码拉取、112M 分区补丁、OpenClash 集成、.config，
#       仓库里不需要放其他任何文件。
# ==============================================================================

name: Build FanChmWrt TR3000 (112M)

on:
  workflow_dispatch:
    inputs:
      layout:
        description: 'U-Boot 大分区布局'
        required: true
        default: '112m'
        type: choice
        options:
          - 112m        # 第三方 mod-112m U-Boot，ubi = 112 MiB
          - 114m        # 第三方 mod-114m U-Boot，ubi = 114 MiB
          - ubootmod    # 官方 OpenWrt U-Boot，ubi = 122.25 MiB（不改分区，用官方 profile）
      include_openclash:
        description: '集成 OpenClash'
        required: true
        default: true
        type: boolean
      include_iphone:
        description: '集成 iPhone USB 共享 (ipheth + usbmuxd，约 +3.5 MiB)'
        required: true
        default: false
        type: boolean

env:
  SRC: fanchmwrt

jobs:
  build:
    # ubuntu-22.04 已于 2026-09-17 进入弃用期（2027-04 移除），这里用受支持的 24.04。
    # 若遇到宿主机工具链报错，可把下面这行改成 ubuntu-22.04 再试。
    runs-on: ubuntu-24.04
    # 免费账号单 job 上限 6 小时；OpenWrt 首次全量编译通常 1~2.5 小时
    timeout-minutes: 350

    steps:
      - name:  checkout（只为拿到 workflow 自身）
        uses: actions/checkout@v4

      - name:  释放磁盘空间（编译需要 ~15GB，默认镜像只剩 ~14GB 可用）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift /opt/az \
                      /usr/local/share/powershell /usr/lib/jvm 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name:  安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext git gperf help2man intltool libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev \
            libssl-dev libtool libyaml-dev lrzsz mkisofs msmtp ninja-build p7zip p7zip-full \
            patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip wget xmlto xxd zlib1g-dev zstd
          nproc && free -g && df -h /

      - name:  ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.event.inputs.layout }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.event.inputs.layout }}-

      - name:  拉取 FanChmWrt 源码
        run: |
          git clone --depth=1 https://github.com/fanchmwrt/fanchmwrt.git "$SRC"
          cd "$SRC"
          echo "版本基线: $(cat version 2>/dev/null || echo unknown)"
          git log -1 --format='commit=%H date=%cd' --date=iso

      - name:  更新 feeds（去掉 telephony/video，省时间省磁盘）
        run: |
          cd "$SRC"
          sed -i '/telephony/d; /\/video.git/d' feeds.conf.default
          cat feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name:  加入 OpenClash
        if: ${{ github.event.inputs.include_openclash }}
        run: |
          cd "$SRC"
          git clone --depth=1 https://github.com/vernesong/OpenClash.git package/OpenClash
          ./scripts/feeds install -a

      - name:  ★ 打大分区补丁（DTS + IMAGE_SIZE）
        env:
          LAYOUT: ${{ github.event.inputs.layout }}
        run: |
          cd "$SRC"
          case "$LAYOUT" in
            112m)     HEX=0x7000000; K=114688k; PROFILE=cudy_tr3000-v1 ;;
            114m)     HEX=0x7280000; K=117248k; PROFILE=cudy_tr3000-v1 ;;
            ubootmod) HEX=0x7a40000; K=125184k; PROFILE=cudy_tr3000-v1-ubootmod ;;
          esac
          echo "布局=$LAYOUT  reg=<0x5c0000 $HEX>  IMAGE_SIZE=$K  PROFILE=$PROFILE"
          echo "PROFILE=$PROFILE" >> $GITHUB_ENV

          if [ "$LAYOUT" != "ubootmod" ]; then
            # 1) DTS：ubi 分区 64M -> 大分区
            sed -i "s/reg = <0x5c0000 0x4000000>;/reg = <0x5c0000 $HEX>;/" \
              target/linux/mediatek/dts/mt7981b-cudy-tr3000-v1.dts
            # 2) filogic.mk：只改 cudy_tr3000-v1 块内的 IMAGE_SIZE
            awk -v size="$K" '
              /^define Device\/cudy_tr3000-v1[[:space:]]*$/ { b=1 }
              b && /^[[:space:]]*IMAGE_SIZE[[:space:]]*:=/ { sub(/:=.*/, ":= " size); b=0 }
              { print }
            ' target/linux/mediatek/image/filogic.mk > /tmp/filogic.mk
            mv /tmp/filogic.mk target/linux/mediatek/image/filogic.mk

            # 3) 校验，失败立即中止
            grep -q "reg = <0x5c0000 $HEX>;" target/linux/mediatek/dts/mt7981b-cudy-tr3000-v1.dts \
              || { echo "::error::DTS 补丁失败"; exit 1; }
            awk '/^define Device\/cudy_tr3000-v1[[:space:]]*$/,/^endef/' \
              target/linux/mediatek/image/filogic.mk | grep -q "IMAGE_SIZE := $K" \
              || { echo "::error::filogic.mk 补丁失败"; exit 1; }
            echo "::notice::112M/114M 分区补丁已应用并校验通过"
          else
            echo "::notice::ubootmod 布局，使用官方 profile，不打分区补丁"
          fi

      - name:  预置文件（USB tethering 自动加入 WAN）
        run: |
          cd "$SRC"
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/90-usb-tethering <<'EOF'
          #!/bin/sh
          uci set network.wan_usb=interface
          uci set network.wan_usb.proto='dhcp'
          uci set network.wan_usb.device='usb0'
          uci set network.wan_usb.peerdns='0'
          uci set network.wan_usb.dns='223.5.5.5 119.29.29.29'
          uci set network.wan_usb.metric='50'
          uci add_list firewall.@zone[1].network='wan_usb'
          uci commit network
          uci commit firewall
          mkdir -p /etc/modules.d
          for m in cdc_ether cdc_ncm rndis_host huawei_cdc_ncm ipheth ax88179_178a asix rtl8152 cdc_mbim qmi_wwan; do
            echo "$m" >> /etc/modules.d/90-usb-net
          done
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/90-usb-tethering

      - name:  生成 .config
        env:
          INCLUDE_OPENCLASH: ${{ github.event.inputs.include_openclash }}
          INCLUDE_IPHONE: ${{ github.event.inputs.include_iphone }}
        run: |
          cd "$SRC"
          {
            echo "CONFIG_TARGET_mediatek=y"
            echo "CONFIG_TARGET_mediatek_filogic=y"
            echo "CONFIG_TARGET_mediatek_filogic_DEVICE_${PROFILE}=y"
            echo "CONFIG_TARGET_ROOTFS_SQUASHFS=y"
            echo "CONFIG_TARGET_ROOTFS_INITRAMFS=y"

            echo "CONFIG_PACKAGE_luci=y"
            echo "CONFIG_PACKAGE_luci-compat=y"
            echo "CONFIG_PACKAGE_luci-mod-admin-full=y"
            echo "CONFIG_PACKAGE_luci-mod-network=y"
            echo "CONFIG_PACKAGE_luci-mod-status=y"
            echo "CONFIG_PACKAGE_luci-mod-system=y"
            echo "CONFIG_PACKAGE_luci-theme-bootstrap=y"
            echo "CONFIG_PACKAGE_luci-app-firewall=y"
            echo "CONFIG_PACKAGE_luci-app-package-manager=y"
            echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y"

            echo "CONFIG_PACKAGE_luci-app-fwx-appfilter=y"
            echo "CONFIG_PACKAGE_fwxd=y"
            echo "CONFIG_PACKAGE_kmod-fwx=y"
            echo "CONFIG_PACKAGE_luci-app-fwx-resources=y"

            # ---- USB 上网：核心 + 手机共享 + USB 网卡 ----
            echo "CONFIG_PACKAGE_kmod-usb-core=y"
            echo "CONFIG_PACKAGE_kmod-usb2=y"
            echo "CONFIG_PACKAGE_kmod-usb3=y"
            echo "CONFIG_PACKAGE_kmod-usb-net=y"
            echo "CONFIG_PACKAGE_kmod-mii=y"
            echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y"
            echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y"
            echo "CONFIG_PACKAGE_kmod-usb-net-rndis=y"
            echo "CONFIG_PACKAGE_kmod-usb-net-huawei-cdc-ncm=y"
            echo "CONFIG_PACKAGE_kmod-usb-net-asix=y"
            echo "CONFIG_PACKAGE_kmod-usb-net-asix-ax88179=y"
            echo "CONFIG_PACKAGE_kmod-usb-net-rtl8152=y"
            echo "CONFIG_PACKAGE_kmod-usb-net-mcs7830=y"
            echo "CONFIG_PACKAGE_kmod-usb-net-sr9700=y"
            echo "CONFIG_PACKAGE_kmod-usb-net-dm9601=y"
            echo "CONFIG_PACKAGE_kmod-usb-net-smsc95xx=y"
            echo "CONFIG_PACKAGE_kmod-usb-wdm=y"
            echo "CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y"
            echo "CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y"
            echo "CONFIG_PACKAGE_kmod-usb-serial=y"
            echo "CONFIG_PACKAGE_kmod-usb-serial-wwan=y"
            echo "CONFIG_PACKAGE_kmod-usb-serial-option=y"
            echo "CONFIG_PACKAGE_usb-modeswitch=y"
            echo "CONFIG_PACKAGE_uqmi=y"
            echo "CONFIG_PACKAGE_umbim=y"
            echo "CONFIG_PACKAGE_usbutils=y"
            echo "CONFIG_PACKAGE_kmod-nls-utf8=y"
            echo "CONFIG_PACKAGE_kmod-usb-storage=y"
            echo "CONFIG_PACKAGE_kmod-usb-storage-uas=y"
            echo "CONFIG_PACKAGE_block-mount=y"
            echo "CONFIG_PACKAGE_kmod-fs-vfat=y"
            echo "CONFIG_PACKAGE_kmod-fs-exfat=y"
            echo "CONFIG_PACKAGE_kmod-fs-ext4=y"

            if [ "$INCLUDE_IPHONE" = "true" ]; then
              echo "CONFIG_PACKAGE_kmod-usb-net-ipheth=y"
              echo "CONFIG_PACKAGE_usbmuxd=y"
              echo "CONFIG_PACKAGE_libusbmuxd=y"
              echo "CONFIG_PACKAGE_libimobiledevice=y"
              echo "CONFIG_PACKAGE_libplist=y"
            fi

            if [ "$INCLUDE_OPENCLASH" = "true" ]; then
              echo "CONFIG_PACKAGE_luci-app-openclash=y"
              echo "CONFIG_PACKAGE_dnsmasq=n"
              echo "CONFIG_PACKAGE_dnsmasq_full_nftset=y"
              echo "CONFIG_PACKAGE_bash=y"
              echo "CONFIG_PACKAGE_curl=y"
              echo "CONFIG_PACKAGE_ca-bundle=y"
              echo "CONFIG_PACKAGE_ip-full=y"
              echo "CONFIG_PACKAGE_ruby=y"
              echo "CONFIG_PACKAGE_ruby-yaml=y"
              echo "CONFIG_PACKAGE_kmod-tun=y"
              echo "CONFIG_PACKAGE_unzip=y"
              echo "CONFIG_PACKAGE_kmod-inet-diag=y"
              echo "CONFIG_PACKAGE_kmod-nft-tproxy=y"
              echo "CONFIG_PACKAGE_luci-i18n-openclash-zh-cn=y"
            fi
          } > .config
          make defconfig
          echo "=== 关键项复核 ==="
          grep -E 'DEVICE_|openclash|ruby|dnsmasq|kmod-usb-net-cdc-ncm|kmod-tun' .config | sort

      - name:  下载源码包
        run: |
          cd "$SRC"
          make download -j$(nproc) V=s
          make download -j1 V=s 2>&1 | grep -iE 'checksum|missing' || true

      - name:  编译
        run: |
          cd "$SRC"
          export CCACHE_DIR="$HOME/.ccache"
          # pipefail 必须开：否则 make 失败也会被 tee 的退出码掩盖
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee build.log
          echo "=== make 退出码: $? ==="

      - name:  体积与产物核对
        run: |
          cd "$SRC/bin/targets/mediatek/filogic"
          ls -lh
          echo "=== 体积红线判定 ==="
          IMG=$(ls -1 *cudy_tr3000*squashfs-sysupgrade* 2>/dev/null | head -1)
          [ -n "$IMG" ] || { echo "::error::未找到 sysupgrade 镜像"; exit 1; }
          SZ=$(stat -c%s "$IMG")
          echo "镜像: $IMG  大小: $((SZ/1048576)) MiB"
          if [ "$SZ" -gt $((100*1048576)) ]; then
            echo "::error::镜像超过 100 MiB，112M 分区刷入后 overlay 将为 0，不可刷"
            exit 1
          elif [ "$SZ" -gt $((60*1048576)) ]; then
            echo "::warning::镜像超过 60 MiB，overlay 偏紧"
          else
            echo "::notice::体积正常"
          fi
          # 注意：不要用 sha256sum *，会撞上 packages/ 目录导致失败
          find . -maxdepth 1 -type f -print0 | xargs -0 sha256sum > sha256sums
          echo "=== 镜像结构 ==="
          tar tvf "$IMG" || true

      - name:  上传固件
        # always()：即使上一步体积核对失败，也要把固件传出来（上次就是栽在这）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-tr3000-${{ github.event.inputs.layout }}-${{ github.run_number }}
          path: |
            fanchmwrt/bin/targets/mediatek/filogic/*
          if-no-files-found: error
          retention-days: 30

      - name:  失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: fanchmwrt/build.log
          retention-days: 7
